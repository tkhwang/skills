interface:
  display_name: "tk Check"
  short_description: "Check the changed files fast (lint, format, incremental typecheck, related tests), or everything with all, and fix what fails without silencing the tools"
  default_prompt: "Use $tk-check on my current change: discover this repo's typecheck/lint/format/test/build commands; apply the linter's write mode, and the formatter's where this repo enforces it, to the changed files; run lint and format on the changed files, an incremental typecheck of their packages and the tests related to them, with warnings as failures (with all: every package, the full suites and the build); treat the format check as advisory, reported but never blocking, when the repo only carries a formatter config without running it; then fix what still fails in the code itself, up to three rounds, never with suppression comments, type escapes, weakened tests or config changes. Report failures that already existed before my change instead of fixing them."
