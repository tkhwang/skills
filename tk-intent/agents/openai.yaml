interface:
  display_name: "tk Intent"
  short_description: "Scaffold an intent from the template, then strengthen the human-written draft through a focused interview"
  default_prompt: "Use $tk-intent. Resolve the selected task by tk-workflow Task selection. For new work choose a stable task slug. With no intent there yet, ask me the title (or take it from the arguments) and scaffold docs/tasks/<slug>/intent.md from the template (ko default, en on request), then stop so I can write it. Once I have written it, read my draft against the codebase, ask me only the important missing decisions one at a time, settle the module, and patch the document in place. Never overwrite an intent in progress. With archive, record why the intent was dropped, give it its ID and move it to the intents archived/ folder."
