interface:
  display_name: "tk Implement"
  short_description: "Implement todo.md task by task, to the end or slice by slice, pausing on database changes"
  default_prompt: "Use $tk-implement to work docs/tasks/todo.md in order: verify each task, check it off with evidence, run to the end (or stop after each slice if I say slice), stop after any sub-phase that changed the database, and never run git commands that change state."
