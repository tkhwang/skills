interface:
  display_name: "tk Verify"
  short_description: "Run checks, then audit tasks, R-ids, tests and the Quality bar in the code, optionally with peer agents; record per R-id"
  default_prompt: "Use $tk-verify: run this repo's typecheck/lint/format/test/build commands through $tk-check in report mode, with warnings as failures, run the plan's behaviour checks, then audit the work without trusting checkboxes or green runs: confirm every task and R-id in the code, read every evidence test for hollow assertions, check the plan's Quality bar and leftover mess. If I name peers (claude, codex, grok), have each audit independently read-only and confirm their findings in the repo before counting them. Record the results in docs/tasks/<slug>/plan.md."
