<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">tk workflow: intent, plan, implement, verify, signoff (한글)</title>
  <desc id="desc">Five stages run left to right. Each stage reads a document and writes a document, and the human approves before the next stage. Intents are permanent, tasks are per piece of work and emptied at signoff, specs describe current behaviour.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b8def"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="24" fill="#0f1115"/>

  <!-- header -->
  <g id="header" transform="translate(56 44)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="600" fill="#8a8f98" letter-spacing="2">TK WORKFLOW</text>
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="34" font-weight="700" fill="#f3f4f6">agent 하나, 다섯 단계, 상태는 파일에.</text>
  </g>

  <!-- stage cards -->
  <g id="stages" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <!-- card template: x positions 56, 284, 512, 740, 968 ; width 176 -->
    <g transform="translate(56 130)">
      <rect width="196" height="112" rx="14" fill="#171a21" stroke="#2a2f3a"/>
      <text x="18" y="34" font-size="18" fill="#8a8f98">[0]</text>
      <text x="18" y="66" font-size="24" font-weight="700" fill="#f3f4f6">tk-intent</text>
      <text x="18" y="94" font-size="19" fill="#b4b9c3">왜 · 무엇 · R-id</text>
    </g>
    <g transform="translate(279 130)">
      <rect width="196" height="112" rx="14" fill="#171a21" stroke="#2a2f3a"/>
      <text x="18" y="34" font-size="18" fill="#8a8f98">[1]</text>
      <text x="18" y="66" font-size="24" font-weight="700" fill="#f3f4f6">tk-plan</text>
      <text x="18" y="94" font-size="19" fill="#b4b9c3">세로 슬라이스</text>
    </g>
    <g transform="translate(502 130)">
      <rect width="196" height="112" rx="14" fill="#171a21" stroke="#2a2f3a"/>
      <text x="18" y="34" font-size="18" fill="#8a8f98">[2]</text>
      <text x="18" y="66" font-size="24" font-weight="700" fill="#f3f4f6">tk-implement</text>
      <text x="18" y="94" font-size="19" fill="#b4b9c3">backend → frontend</text>
    </g>
    <g transform="translate(725 130)">
      <rect width="196" height="112" rx="14" fill="#171a21" stroke="#2a2f3a"/>
      <text x="18" y="34" font-size="18" fill="#8a8f98">[3]</text>
      <text x="18" y="66" font-size="24" font-weight="700" fill="#f3f4f6">tk-verify</text>
      <text x="18" y="94" font-size="19" fill="#b4b9c3">tsc · eslint · 테스트</text>
    </g>
    <g transform="translate(948 130)">
      <rect width="196" height="112" rx="14" fill="#171a21" stroke="#5b8def"/>
      <text x="18" y="34" font-size="18" fill="#8a8f98">[4]</text>
      <text x="18" y="66" font-size="24" font-weight="700" fill="#f3f4f6">tk-signoff</text>
      <text x="18" y="94" font-size="19" fill="#b4b9c3">Go / No-Go</text>
    </g>

    <!-- arrows with human gate dots -->
    <g stroke="#5b8def" stroke-width="2" fill="none">
      <line x1="252" y1="186" x2="277" y2="186" marker-end="url(#arrow)"/>
      <line x1="475" y1="186" x2="500" y2="186" marker-end="url(#arrow)"/>
      <line x1="698" y1="186" x2="723" y2="186" marker-end="url(#arrow)"/>
      <line x1="921" y1="186" x2="946" y2="186" marker-end="url(#arrow)"/>
    </g>
    <text x="600" y="120" text-anchor="middle" font-size="18" fill="#5b8def">화살표마다 사람이 승인하고 넘어간다</text>
  </g>

  <!-- artifact lanes -->
  <g id="artifacts" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <!-- connectors from cards to lane -->
    <g stroke="#2a2f3a" stroke-width="2">
      <line x1="154" y1="242" x2="154" y2="282"/>
      <line x1="377" y1="242" x2="377" y2="282"/>
      <line x1="600" y1="242" x2="600" y2="282"/>
      <line x1="823" y1="242" x2="823" y2="282"/>
      <line x1="1046" y1="242" x2="1046" y2="282"/>
    </g>

    <!-- intents lane: permanent -->
    <g transform="translate(56 282)">
      <rect width="196" height="96" rx="12" fill="#121722" stroke="#2a2f3a"/>
      <text x="16" y="30" fill="#8a8f98" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">작성 · 영구 보관</text>
      <text x="16" y="58" fill="#e5e7eb">docs/intents/</text>
      <text x="16" y="82" fill="#b4b9c3">AGENT001-slug.md</text>
    </g>

    <!-- tasks lane: spans plan, implement, verify -->
    <g transform="translate(279 282)">
      <rect width="642" height="96" rx="12" fill="#121722" stroke="#2a2f3a"/>
      <text x="16" y="30" fill="#8a8f98" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">작업 단위 · 덮어쓰고 signoff 때 비움</text>
      <text x="16" y="58" fill="#e5e7eb">docs/tasks/plan.md</text>
      <text x="16" y="82" fill="#b4b9c3">결정 · R-id 커버리지</text>
      <text x="360" y="58" fill="#e5e7eb">docs/tasks/todo.md</text>
      <text x="360" y="82" fill="#b4b9c3">- [x] T1.1 · 증거</text>
    </g>

    <!-- specs lane -->
    <g transform="translate(948 282)">
      <rect width="196" height="96" rx="12" fill="#121722" stroke="#5b8def"/>
      <text x="16" y="30" fill="#8a8f98" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">갱신 · 현재 상태</text>
      <text x="16" y="58" fill="#e5e7eb">docs/specs/</text>
      <text x="16" y="82" fill="#b4b9c3">intent Outcome</text>
    </g>
  </g>

  <text x="56" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="18" fill="#8a8f98">tk-grill 은 미결 결정을 하나씩 묻는다 · tk-setup 은 repo 당 한 번 · agent 는 commit 하지 않는다</text>
</svg>
