interface:
  display_name: "tk Intent"
  short_description: "Scaffold an intent from the template, then strengthen the human-written draft through a focused interview"
  default_prompt: "Use $tk-intent. With no arguments, ask me module, title and language (ko default) and scaffold. With <MODULE> <title>, scaffold a new intent file from the template and stop so I can write it. With an intent id, read my draft against the codebase, ask me only the important missing decisions one at a time, and patch the document in place. With archive <ID>, record why the intent was dropped and move it to archived/."
